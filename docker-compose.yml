services:
  postgres:
    image: postgres:15
    container_name: kintaiapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kintaiapp
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kintaiapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
